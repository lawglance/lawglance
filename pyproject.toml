[project]
name = "lawglance"
version = "0.1.0"
description = "Your AI-Powered Legal Assistan"
authors = [{name = "https://lawglance.com/" }]
maintainers = [
    {name = "Sreejith G", email = "gsreejith828@gmail.com"},
    {name = "Meenu Dev", email = "mee.dev03@gmail.com"},
    {name = "Brijesh", email = "brijesh@curvelogics.com"},
    {name = "Haritha C", email = "harithac.contactmail@gmail.com"},
    {name = "Midhun M I", email = "midhunmi2011@gmail.com"},

]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb==1.5.9",
    "fastapi==0.141.1",
    "ipykernel>=6.30.1",
    "jupyter>=1.1.1",
    "langchain==1.3.15",
    "langchain-chroma==1.1.0",
    "langchain-classic==1.0.8",
    "langchain-community==0.4.2",
    "langchain-core==1.5.6",
    "langchain-openai>=1.5.2",
    "langchain-text-splitters==1.1.2",
    "langchainhub==0.1.21",
    "langdetect==1.0.9",
    "langgraph==1.2.11",
    "langsmith==0.11.0",
    "openai>=1.66.3",
    "pymupdf==1.28.2",
    "pymupdfb==1.24.10",
    "redis>=6.3.0",
    "streamlit==1.61.1",
    "uvicorn[standard]==0.52.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
extend-exclude = ["*.ipynb"]
